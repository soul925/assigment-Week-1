<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .form-control.is-invalid + .invalid-feedback {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <form class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control is-invalid" id="firstName" placeholder="First Name" required>
        <div class="invalid-feedback">Please supply your first name</div>
      </div>

      <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control is-invalid" id="lastName" placeholder="Last Name" required>
        <div class="invalid-feedback">Please supply your last name</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-Mail</label>
        <input type="email" class="form-control is-invalid" id="email" placeholder="E-Mail Address" required>
        <div class="invalid-feedback">Please supply your email address</div>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone #</label>
        <input type="text" class="form-control is-invalid" id="phone" placeholder="(845)555-1212" required>
        <div class="invalid-feedback">Please supply your phone number</div>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control is-invalid" id="address" placeholder="Address" required>
        <div class="invalid-feedback">Please supply your street address</div>
      </div>

      <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input type="text" class="form-control is-invalid" id="city" placeholder="City" required>
        <div class="invalid-feedback">Please supply your city</div>
      </div>

      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </div>

  <script>
    // Optional JavaScript for client-side validation
    (function () {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
</body>
</html>
