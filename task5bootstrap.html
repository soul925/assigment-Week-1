<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .form-control:invalid {
      border-color: #dc3545;
      padding-right: 2.25rem;
      background-image: none;
    }
    .form-control:invalid ~ .form-icon {
      color: #dc3545;
      display: block;
    }
    .form-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
    }
    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container mt-5" style="max-width: 500px;">
    <form class="needs-validation" novalidate>
      
  
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" id="name" required>
        <i class="fas fa-exclamation-circle form-icon"></i>
        <div class="text-danger small">Name is required</div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" required>
        <i class="fas fa-exclamation-circle form-icon"></i>
        <div class="text-danger small">Email is required</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" required>
        <i class="fas fa-exclamation-circle form-icon"></i>
        <div class="text-danger small">Password is required</div>
      </div>

 
      <div class="form-group">
        <label for="hobbies">Hobbies</label>
        <select class="form-select" id="hobbies">
          <option selected disabled>Select a hobby</option>
          <option>Reading</option>
          <option>Traveling</option>
          <option>Gaming</option>
        </select>
      </div>

      <button class="btn btn-danger w-100" type="submit">Submit</button>
    </form>
  </div>

  <script>
    (function () {
      'use strict';
      const form = document.querySelector('.needs-validation');
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false);
    })();
  </script>
</body>
</html>
